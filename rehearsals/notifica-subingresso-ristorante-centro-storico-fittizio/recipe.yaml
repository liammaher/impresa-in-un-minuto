# Presentare l'aggiornamento della registrazione impresa alimentare - subingresso (Esercizio di somministrazione di alimenti e bevande in zone tutelate), as gen.py writes its steps file from the batch crawl
# (catalogue/F839/sections/suap-061-presentare-l-aggiornamento-della-registrazione-imp.json), for the made-up business of this folder's fixture.json.
# Derived from rehearsals/subingresso-ristorante-centro-storico-fittizio (bench/derive_recipe.py): no `rules:` and no `after:`; the attachments and payment screens are not read.
procedure: napoli/comune/subingresso-attivita-commerciale
title: "Presentare l'aggiornamento della registrazione impresa alimentare - subingresso, bar o ristorante, zone tutelate, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-061-presentare-l-aggiornamento-della-registrazione-imp
subject: impresa
operation: Presentare l'aggiornamento della registrazione impresa alimentare - subingresso
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: [Esercizio di somministrazione di alimenti e bevande in zone tutelate], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: ["Presentare l'aggiornamento della registrazione impresa alimentare - subingresso"], confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Qualcuna di queste voci vale per l'attività? Spunta tutte quelle che valgono, o nessuna."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "È una società con altri soci o amministratori oltre a chi dichiara", why: "Ciascuno presenta una propria dichiarazione antimafia firmata (art. 85 D.Lgs. 159/2011), che non preparo ancora."}
  descrizione: {type: text, question: "Nome della bozza in Pratiche in bozza sul portale", default: "subingresso {{business.denominazione}}"}
  diritti_euro: {type: number, question: "I diritti SUAP in euro", default: "96", why: "La colonna VCA del tariffario 2026 per un bar o ristorante fuori dalle zone tutelate con notifica sanitaria (S72)."}
  oggetto: {question: "La pratica in una frase (300 caratteri)"}
yours:
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Spunta tu le dichiarazioni: consapevolezza (artt. 46-47), informativa privacy, art. 6 Reg. 852/2004, tasse comunali"
  - "Paga i diritti di segreteria (€ {{ask.diritti_euro}}) con pagoPA nella schermata di pagamento, e la tariffa propria dell'ASL"
  - "Firma e invia (Firma e invio) entro 90 giorni dall'atto; conserva la ricevuta"
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "Per ora per una ditta individuale o una srl, srls, snc, sas o spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Gli altri soci o amministratori presentano le proprie dichiarazioni antimafia come allegati firmati (art. 85 D.Lgs. 159/2011): non lo preparo ancora."}
  - {when: "{{ask.atto_registrato}}", else: "Un atto ancora in corso di registrazione per ora non lo preparo: in quel caso il portale accetta la sua copia firmata, che spetta a te caricare. Presenta la pratica dopo la registrazione."}
