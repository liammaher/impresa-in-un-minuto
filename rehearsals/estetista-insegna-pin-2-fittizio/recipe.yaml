# Aprire l'attività di estetista (Acconciatore, barbiere, estetista, tatuatore e piercer), as gen.py writes its steps file from the batch crawl
# (catalogue/F839/sections/suap-011-aprire-l-attivita-di-estetista-pin-2.json), for the made-up business of this folder's fixture.json.
# Derived from rehearsals/estetista-insegna-fittizio (bench/derive_recipe.py): no `rules:` and no `after:`; the attachments and payment screens are not read.
procedure: napoli/comune/scia-acconciatore-estetista
title: "Aprire l'attività di estetista, Acconciatore, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-011-aprire-l-attivita-di-estetista-pin-2
subject: impresa
operation: Aprire l'attività di estetista
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
scelte: ["in caso di attività che preveda insegna esterna"]
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  # The sector sits twice in Napoli's tree; both lead to the same pratica.
  - {screen: Scelta settore attività, tree: [{leaf: "Acconciatore, barbiere, estetista, tatuatore e piercer", nth: 1}], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: ["Aprire l'attività di estetista", "PIN 2 - Segnalazione Certificata di Inizio Attività"], confirm: CONFERMA}
  - {screen: Scelta interventi eventuali, tree: [{leaf: "in caso di attività che preveda insegna esterna", nth: 1}], confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Qualcuna di queste voci vale per l'attività? Spunta tutte quelle che valgono, o nessuna."
asks:
  insegna_consenso: {group: extras, type: yes_no, item: "L'insegna richiede il consenso di altri (il proprietario dell'edificio o il condominio)", why: "In quel caso il portale chiede i dati e l'assenso del proprietario: non lo preparo ancora."}
  insegna_vincolo: {group: extras, type: yes_no, item: "L'edificio o l'area sono sottoposti a vincolo paesaggistico (parte III del D.Lgs. 42/2004)", why: "La SCIA dell'insegna vale solo dopo l'autorizzazione paesaggistica: la dichiaro nella bozza e te lo ricordo tra i tuoi passi."}
  insegna_bene_culturale: {group: extras, type: yes_no, item: "L'edificio o l'area sono tutelati come bene culturale (parte II del D.Lgs. 42/2004)", why: "In tal caso serve prima l'autorizzazione della Soprintendenza (art. 49), caso non ancora previsto."}
  insegna_grande: {group: extras, type: yes_no, item: "Le insegne insieme superano i 5 m²", why: "Sopra i 5 m² è dovuto anche il canone unico: un pagamento a parte, che non preparo ancora."}
  altri_soggetti: {group: extras, type: yes_no, item: "È una società con altri soci o amministratori oltre a chi dichiara", why: "Ciascuno presenta una propria dichiarazione antimafia firmata (art. 85 D.Lgs. 159/2011), che non preparo ancora."}
  descrizione: {default: "acconciatore {{business.denominazione}}"}
  oggetto: {question: "La pratica in una frase (300 caratteri)"}
yours:
  - "Con il vincolo paesaggistico la SCIA dell'insegna vale solo dopo l'autorizzazione paesaggistica: allegala o presentala (l'ufficio cura il procedimento) e installa l'insegna solo dopo"
  - "Il professionista antincendio firma tu o per lui, con la sua firma digitale, l'asseverazione e le dichiarazioni dei Vigili del Fuoco: il portale le fa firmare al professionista, non al titolare"
  - "Paga ai Vigili del Fuoco la tariffa della categoria (€ {{ask.vvf_importo}}) e allega la copia del versamento firmata digitalmente (.p7m)"
  - "Spunta tu le dichiarazioni dell'insegna (ulteriori dichiarazioni, mezzi pubblicitari)"
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Spunta tu le dichiarazioni: la casella di presa d'atto sotto la PEC, la dichiarazione antimafia, consapevolezza (artt. 46-47), informativa privacy, altre dichiarazioni, tasse comunali, art. 75 DPR 445/2000"
  - "In Allega documenti: la planimetria quotata e la relazione descrittiva dei locali, firmate digitalmente (.p7m)"
  - "Firma e invia (Firma e invio); conserva la ricevuta"
supports:
  - {when: "{{ask.vvf_parziale|not}}", else: "Una SCIA antincendio parziale (lotto, stralcio, adeguamento parziale) non la preparo ancora."}
  - {value: "{{ask.vvf_categoria}}", in: [a], else: "Per le attività di categoria B e C la SCIA antincendio segue l'approvazione del progetto da parte dei Vigili del Fuoco (con il suo numero di pratica): non la preparo ancora."}
  - {when: "{{ask.vvf_pnrr|not}}", else: "Un'attività finanziata dal PNRR, PNC o ZES apre altre voci della SCIA antincendio, che non preparo ancora."}
  - {when: "{{ask.vvf_impianti_speciali|not}}", else: "Impianti di idrogeno, GNL/GNC, rifiuti o le facciate e coperture di edifici civili aprono altre voci della SCIA antincendio, che non preparo ancora."}
  - {when: "{{ask.insegna_consenso|not}}", else: "Un'insegna che richiede il consenso del proprietario o del condominio per ora non la preparo."}
  - {when: "{{ask.insegna_bene_culturale|not}}", else: "Un'insegna su un edificio o in un'area tutelati come bene culturale richiede prima l'autorizzazione della Soprintendenza (art. 49 D.Lgs. 42/2004): non lo preparo ancora."}
  - {when: "{{ask.insegna_grande|not}}", else: "Le insegne sopra i 5 m² pagano anche il canone unico: per ora non lo preparo."}
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "Per ora per una ditta individuale o una srl, srls, snc, sas o spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Gli altri soci o amministratori presentano le proprie dichiarazioni antimafia come allegati firmati (art. 85 D.Lgs. 159/2011): non lo preparo ancora."}

# Which pratica a case is: the library's rules table (rules/suap-napoli.yaml) decides (route.py reaches this file by
# the table's portal sector and operation, and the facts fixed here).
rules:
  table: suap-napoli
  facts: {attivita: estetista, evento: apertura, insegna: "true", prevenzione_incendi: "true"}
  handles: [napoli/comune/insegna-esercizio, napoli/vigili-del-fuoco/scia-prevenzione-incendi]
