# Trasferire la sede dell'attività (Vicinato - settore alimentare consumo immediato (zone tutelate)), as gen.py writes its steps file from the batch crawl
# (catalogue/F839/sections/suap-018-trasferire-la-sede-dell-attivita-pin-2.json), for the made-up business of this folder's fixture.json.
# Derived from rehearsals/trasferimento-alimentari-centro-storico-fittizio (bench/derive_recipe.py): no `rules:` and no `after:`; the attachments and payment screens are not read.
procedure: napoli/comune/scia-esercizio-vicinato
title: "Trasferire la sede dell'attività, negozio alimentare, zone tutelate, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-018-trasferire-la-sede-dell-attivita-pin-2
subject: impresa
operation: Trasferire la sede dell'attività
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: [Vicinato - settore alimentare consumo immediato (zone tutelate)], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: ["Trasferire la sede dell'attività", "PIN 2 - Segnalazione Certificata di Inizio Attività"], confirm: CONFERMA}
  - {screen: Scelta interventi eventuali, confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Qualcuna di queste voci vale per il negozio? Spunta tutte quelle che valgono, o nessuna."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "È una società con altri soci o amministratori oltre a chi dichiara", why: "Ciascuno presenta una propria dichiarazione antimafia firmata (art. 85 D.Lgs. 159/2011), che non preparo ancora."}
  descrizione: {type: text, question: "Nome della bozza in Pratiche in bozza sul portale", default: "trasferimento centro storico {{business.denominazione}}"}
  speciali: {group: extras, type: yes_no, item: "Vende armi, metalli preziosi, prodotti fitosanitari, medicinali o mangimi", why: "Ciascuno aggiunge alla pratica una propria autorizzazione o SCIA: casi che non preparo ancora."}
  insegna_esterna: {group: extras, type: yes_no, item: "Avrai un'insegna esterna nei nuovi locali", why: "Un'insegna esterna include in questa la SCIA dell'insegna: per ora non la preparo."}
  in_centro_commerciale: {type: yes_no, question: "I nuovi locali sono dentro un centro commerciale?", default: "false", why: "Napoli chiede il tipo di centro commerciale: non lo preparo ancora."}
  diritti_euro: {type: number, question: "I diritti SUAP in euro (la colonna VCA della tabella 2026 per un negozio alimentare con consumo sul posto nelle zone tutelate, con la notifica sanitaria: controllala)"}
  oggetto: {question: "La pratica in una frase (300 caratteri)"}
yours:
  - "Il professionista antincendio firma tu o per lui, con la sua firma digitale, l'asseverazione e le dichiarazioni dei Vigili del Fuoco: il portale le fa firmare al professionista, non al titolare"
  - "Paga ai Vigili del Fuoco la tariffa della categoria (€ {{ask.vvf_importo}}) e allega la copia del versamento firmata digitalmente (.p7m)"
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Spunta tu le dichiarazioni: consapevolezza (artt. 46-47), informativa privacy, le regole di Napoli (normative comunali), requisiti di onorabilità e professionali, altre dichiarazioni, art. 6 Reg. 852/2004, tasse comunali, art. 75 DPR 445/2000"
  - "Fai firmare al tuo tecnico i modelli CS 1 (criteri strutturali) e CG 1 (punteggio di gestione) del Piano, che il portale genera dopo aver spuntato le dichiarazioni, e allegali"
  - "Paga i diritti di segreteria (€ {{ask.diritti_euro}}) con pagoPA nella schermata di pagamento, e la tariffa forfettaria ASL"
  - "{{ask.bollo_marche,ask.bollo_esenzione|bollo_yours}}"
  - "Allega quanto chiede la schermata degli allegati dopo aver spuntato le dichiarazioni"
  - "Firma e invia (Firma e invio); non aprire nei nuovi locali prima che arrivi l'autorizzazione"
supports:
  - {when: "{{ask.vvf_parziale|not}}", else: "Una SCIA antincendio parziale (lotto, stralcio, adeguamento parziale) non la preparo ancora."}
  - {value: "{{ask.vvf_categoria}}", in: [a], else: "Per le attività di categoria B e C la SCIA antincendio segue l'approvazione del progetto da parte dei Vigili del Fuoco (con il suo numero di pratica): non la preparo ancora."}
  - {when: "{{ask.vvf_pnrr|not}}", else: "Un'attività finanziata dal PNRR, PNC o ZES apre altre voci della SCIA antincendio, che non preparo ancora."}
  - {when: "{{ask.vvf_impianti_speciali|not}}", else: "Impianti di idrogeno, GNL/GNC, rifiuti o le facciate e coperture di edifici civili aprono altre voci della SCIA antincendio, che non preparo ancora."}
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "Per ora per una ditta individuale o una srl, srls, snc, sas o spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Gli altri soci o amministratori presentano le proprie dichiarazioni antimafia come allegati firmati (art. 85 D.Lgs. 159/2011): non lo preparo ancora."}
  - {when: "{{ask.speciali|not}}", else: "Armi, metalli preziosi, prodotti fitosanitari, medicinali o mangimi per ora non li preparo."}
  - {when: "{{ask.in_centro_commerciale|not}}", else: "Nuovi locali dentro un centro commerciale per ora non li preparo: Napoli chiede il tipo di centro."}
  - {when: "{{ask.in_factory_outlet|not}}", else: "Un negozio in un factory outlet per ora non lo preparo."}
  - {when: "{{ask.dettaglio_alimenti}}", else: "È la pratica di un negozio alimentare: deve valere la voce della notifica sul commercio al dettaglio di alimenti."}
  - {when: "{{ask.ristorazione|not}} {{ask.forno|not}}", else: "Un negozio che serve anche cibo o produce prodotti da forno per ora non lo preparo: queste voci della notifica non sono ancora mappate insieme."}
rules:
  table: suap-napoli
  facts: {attivita: vicinato_alimentare, evento: trasferimento, consumo_sul_posto: true, insegna: "{{ask.insegna_esterna}}", prevenzione_incendi: "true"}
  handles: [napoli/asl-napoli-1/registrazione-attivita-alimentare, napoli/vigili-del-fuoco/scia-prevenzione-incendi]
