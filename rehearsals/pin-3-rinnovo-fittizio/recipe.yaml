# PIN 3 - Attestazione di rinnovo periodico di conformità antincendio (Esercizio di somministrazione di alimenti e bevande in zone NON tutelate), as gen.py writes its steps file from the batch crawl
# (catalogue/F839/sections/suap-common-prevenzione-incendi-pin-3-attestazione-di-rinnovo-periodico.json), for the made-up business of this folder's fixture.json.
# Derived from rehearsals/pin-6-verifiche-fittizio (bench/derive_recipe.py): no `rules:` and no `after:`; the attachments and payment screens are not read.
procedure: napoli/comune/insegna-esercizio
title: "PIN 3 - Attestazione di rinnovo periodico di conformità antincendio, bar o ristorante, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-common-prevenzione-incendi-pin-3-attestazione-di-rinnovo-periodico
subject: impresa
operation: PIN 3 - Attestazione di rinnovo periodico di conformità antincendio
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: [Esercizio di somministrazione di alimenti e bevande in zone NON tutelate], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: ["PIN 3 - Attestazione di rinnovo periodico di conformità antincendio"], confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Qualcuna di queste voci vale per questa pratica? Spunta tutte quelle che valgono, o nessuna."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "È una società con altri soci o amministratori oltre a chi dichiara", why: "Ciascuno presenta una propria dichiarazione antimafia firmata (art. 85 D.Lgs. 159/2011), che non preparo ancora."}
  descrizione: {type: text, question: "Nome della bozza in Pratiche in bozza sul portale", default: "bar o ristorante {{business.denominazione}}"}
  oggetto: {question: "La pratica in una frase (300 caratteri)"}
yours:
  - "Paga ai Vigili del Fuoco la tariffa della categoria (€ {{ask.vvf_importo}}) e allega la copia del versamento firmata digitalmente (.p7m)"
  - "Il professionista antincendio firma tu o per lui, con la sua firma digitale, l'asseverazione: se l'attività non ha impianti di protezione attiva la dichiarazione relativa all'asseverazione la spunti tu"
  - "Nella dichiarazione del responsabile dell'attività spunti tu le sue dichiarazioni (assenza di variazione, dati riportati, obblighi gestionali) e inserisci la data della SCIA e l'attività principale: il portale abilita quelle caselle solo dopo la tua spunta"
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Spunta tu le dichiarazioni della pratica: consapevolezza (artt. 46-47), informativa privacy, tasse comunali"
  - "Allega quanto chiede la schermata degli allegati dopo aver spuntato le dichiarazioni"
  - "Firma e invia (Firma e invio); conserva la ricevuta"
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "Per ora per una ditta individuale o una srl, srls, snc, sas o spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Gli altri soci o amministratori presentano le proprie dichiarazioni antimafia come allegati firmati (art. 85 D.Lgs. 159/2011): non lo preparo ancora."}
  - {value: "{{ask.vvf_categoria}}", in: [a], else: "Per le attività di categoria B e C le voci del modulo (la tendina delle attività) non le ho ancora lette sul portale: non la preparo ancora."}
  - {value: "{{ask.vvf_approccio}}", in: [standard, conforme, deroga], else: "Per il rinnovo preparo l'approccio standard, la soluzione conforme e quella in deroga: l'ingegneria della sicurezza (apre un allegato) e la soluzione alternativa non le preparo ancora."}
