# The same SCIA as rehearsals/insegna-ristorante-scia-fittizio, for a building or area under landscape protection
# and/or in zone A of the PRG: the form's two Si/No facts ("L'installazione ricade in zona A di P.R.G.", "...in area
# sottoposta a vincolo paesaggistico") answered Si. Read on the portal 2026-11-20 on a draft of the plain case: the
# Si opens no box and no section on the declarations page (the radios only swap), so the filing is the same; what
# changes is the person's: the library's insegna-esercizio says that in a landscape-protected area the SCIA stays
# ineffective until the authorization, and that a building protected as a cultural asset needs the Soprintendenza's
# (art. 49) first, which this recipe still refuses (the form has no box for it and the attachments screen isn't read).
# Zone A is refused in the plain recipe as "other conditions" without a source; the library's sources find no
# specific rule for the centro storico, so here the form's fact is only stated.
# The SCIA for an outside sign of a bar or restaurant already running (Mezzi pubblicitari: "SCIA per installazione
# insegna di esercizio", sector 60), as gen.py writes its steps file from the batch crawl
# (catalogue/F839/sections/suap-common-mezzi-pubblicitari-installazione-di-mezzi-pubblicitari-scia-4.json), for the
# pizzeria rehearsal's made-up ditta individuale (rehearsals/pizzeria-fittizia/fixture.json). The same six sign
# sections as rehearsals/negozio-insegna-scia-fittizio, written from the crawl's text; the business here has a
# title (the SCIA of its opening), so the title section is filled. The attachments and payment screens are not read.
procedure: napoli/comune/insegna-esercizio
title: "SCIA: insegna esterna per un bar o ristorante già avviato, in area vincolata o in zona A, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-common-mezzi-pubblicitari-installazione-di-mezzi-pubblicitari-scia-4
subject: impresa
operation: SCIA per installazione insegna di esercizio
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: [Esercizio di somministrazione di alimenti e bevande in zone NON tutelate], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: [SCIA per installazione insegna di esercizio], confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Qualcuna di queste voci vale per l'insegna? Spunta tutte quelle che valgono, o nessuna."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "È una società con altri soci o amministratori oltre a chi dichiara", why: "Ciascuno presenta una propria dichiarazione antimafia firmata (art. 85 D.Lgs. 159/2011), che non preparo ancora."}
  insegna_vincolo: {group: extras, type: yes_no, item: "L'edificio o l'area sono sottoposti a vincolo paesaggistico (parte III del D.Lgs. 42/2004)", why: "La SCIA dell'insegna vale solo dopo l'autorizzazione paesaggistica: la dichiaro nella bozza e te lo ricordo tra i tuoi passi."}
  insegna_zona_a: {group: extras, type: yes_no, item: "L'installazione ricade in zona A del PRG (il centro storico)", why: "Il modulo chiede questo fatto e lo dichiaro come me lo dici."}
  insegna_bene_culturale: {group: extras, type: yes_no, item: "L'edificio o l'area sono tutelati come bene culturale (parte II del D.Lgs. 42/2004)", why: "In tal caso serve prima l'autorizzazione della Soprintendenza (art. 49), caso non ancora previsto."}
  insegna_grande: {group: extras, type: yes_no, item: "Le insegne superano complessivamente 5 m²", why: "Oltre 5 m² è dovuto anche il canone unico: un pagamento a parte, che non preparo ancora."}
  descrizione: {type: text, question: "Nome della bozza in Pratiche in bozza sul portale", default: "insegna ristorante {{business.denominazione}}"}
  diritti_euro: {type: number, question: "I diritti SUAP in euro (controlla la voce nel tariffario 2026 per la SCIA dell'insegna; 0 se non dovuti)"}
  oggetto: {question: "La pratica in una frase (300 caratteri)"}
yours:
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Spunta tu le dichiarazioni sull'insegna (ulteriori dichiarazioni, mezzi pubblicitari) e le altre della pratica: consapevolezza (artt. 46-47), informativa privacy, tasse comunali"
  - "Paga i diritti di segreteria (€ {{ask.diritti_euro}}) con pagoPA nella schermata di pagamento"
  - "Allega quanto chiede la schermata degli allegati dopo aver spuntato le dichiarazioni; con il vincolo paesaggistico, allega o presenta anche l'autorizzazione paesaggistica (l'ufficio cura il procedimento) e installa l'insegna solo dopo"
  - "Firma e invia (Firma e invio); conserva la ricevuta"
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "Per ora per una ditta individuale o una srl, srls, snc, sas o spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Gli altri soci o amministratori presentano le proprie dichiarazioni antimafia come allegati firmati (art. 85 D.Lgs. 159/2011): non lo preparo ancora."}
  - {when: "{{ask.insegna_bene_culturale|not}}", else: "Un'insegna su un edificio o in un'area tutelati come bene culturale richiede prima l'autorizzazione della Soprintendenza (art. 49 D.Lgs. 42/2004): non lo preparo ancora."}
  - {when: "{{ask.insegna_grande|not}}", else: "Le insegne oltre 5 m² pagano anche il canone unico, che non preparo ancora."}
