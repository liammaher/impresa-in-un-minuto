# Richiesta di adesione all'autorizzazione in via generale per installazione nuovo impianto, modifica sostanziale, rinnovo dell'adesione, trasferimento di impianto esistente - Attività in deroga (art. 272 commi 2 e 3 D.Lgs. 152/2006) (Esercizio di somministrazione di alimenti e bevande in zone NON tutelate), as gen.py writes its steps file from the batch crawl
# (catalogue/F839/sections/suap-common-emissioni-in-atmosfera-richiesta-di-adesione-all-autorizzazi.json), for the made-up business of this folder's fixture.json.
# Derived from rehearsals/emissioni-adesione-pulitintolavanderia-fittizia (bench/derive_recipe.py): no `rules:` and no `after:`; the attachments and payment screens are not read.
procedure: napoli/comune/insegna-esercizio
title: "Richiesta di adesione all'autorizzazione in via generale per installazione nuovo impianto, modifica sostanziale, rinnovo dell'adesione, trasferimento di impianto esistente - Attività in deroga (art. 272 commi 2 e 3 D.Lgs. 152/2006), bar o ristorante, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-common-emissioni-in-atmosfera-richiesta-di-adesione-all-autorizzazi
subject: impresa
operation: Richiesta di adesione all'autorizzazione in via generale per installazione nuovo impianto, modifica sostanziale, rinnovo dell'adesione, trasferimento di impianto esistente - Attività in deroga (art. 272 commi 2 e 3 D.Lgs. 152/2006)
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: [Esercizio di somministrazione di alimenti e bevande in zone NON tutelate], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: ["Richiesta di adesione all'autorizzazione in via generale per installazione nuovo impianto, modifica sostanziale, rinnovo dell'adesione, trasferimento di impianto esistente - Attività in deroga (art. 272 commi 2 e 3 D.Lgs. 152/2006)"], confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Qualcuna di queste voci vale per l'impianto? Spunta tutte quelle che valgono, o nessuna."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "È una società con altri soci o amministratori oltre a chi dichiara", why: "Ciascuno presenta una propria dichiarazione antimafia firmata (art. 85 D.Lgs. 159/2011), che non preparo ancora."}
  piu_macchine: {group: extras, type: yes_no, item: "L'impianto ha più di una macchina di lavaggio a ciclo chiuso", why: "Il modulo chiede una riga (modello, volume del tamburo, solvente e quantità) per ogni macchina, tutte obbligatorie: per ora ne preparo una sola."}
  descrizione: {type: text, question: "Nome della bozza in Pratiche in bozza sul portale", default: "pulitintolavanderia {{business.denominazione}}"}
  oggetto: {question: "La pratica in una frase (300 caratteri)"}
yours:
  - "Apri la bozza in Pratiche in bozza ({{ask.descrizione}}) e confrontala con questa pagina"
  - "Spunta tu l'impegno a rispettare i requisiti dell'impianto e le altre dichiarazioni della pratica: consapevolezza (artt. 46-47), informativa privacy, tasse comunali"
  - "Allega quanto chiede la schermata degli allegati dopo aver spuntato le dichiarazioni"
  - "Firma e invia (Firma e invio); conserva la ricevuta"
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "Per ora per una ditta individuale o una srl, srls, snc, sas o spa."
  - {when: "{{ask.piu_macchine|not}}", else: "Più macchine di lavaggio nell'impianto: il modulo chiede una riga obbligatoria per ciascuna, per ora ne preparo una sola."}
  - {when: "{{ask.altri_soggetti|not}}", else: "Gli altri soci o amministratori presentano le proprie dichiarazioni antimafia come allegati firmati (art. 85 D.Lgs. 159/2011): non lo preparo ancora."}
